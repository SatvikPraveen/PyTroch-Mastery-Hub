[tox]
envlist = py310, py311, py312, py313, lint, docs
skipsdist = False
isolated_build = True

[testenv]
deps =
    pytest>=6.2.0
    pytest-cov>=2.12.0
    pytest-xdist>=2.5.0
    torch>=2.0.0
    torchvision>=0.15.0
commands =
    pytest tests/ -v -x --cov=pytorch_mastery_hub --cov-report=term-missing {posargs}
extras = dev

[testenv:lint]
deps =
    ruff>=0.5.0
    bandit[toml]>=1.7.6
    mypy>=1.8.0
    types-PyYAML
    types-requests
commands =
    ruff check src tests examples scripts
    ruff format --check src tests examples scripts
    bandit -c pyproject.toml -r src
    mypy
skip_install = False

[testenv:format]
deps =
    ruff>=0.5.0
commands =
    ruff check --fix src tests examples scripts
    ruff format src tests examples scripts
skip_install = True

[testenv:docs]
deps =
    sphinx>=4.0.0
    sphinx-rtd-theme>=1.0.0
    nbsphinx>=0.8.0
    sphinx-autodoc-typehints>=1.12.0
    myst-parser>=0.18.0
commands =
    sphinx-build -b html docs/ docs/_build/html
extras = docs

[testenv:security]
deps =
    bandit>=1.7.0
    pip-audit>=2.7.0
commands =
    bandit -c pyproject.toml -r src -f json -o bandit-report.json
    pip-audit
skip_install = True

[testenv:coverage]
deps =
    pytest>=6.2.0
    pytest-cov>=2.12.0
    coverage[toml]>=6.0.0
    torch>=2.0.0
    torchvision>=0.15.0
commands =
    pytest tests/ --cov=pytorch_mastery_hub --cov-report=html --cov-report=xml --cov-report=term-missing
    coverage report --fail-under=70
extras = dev
