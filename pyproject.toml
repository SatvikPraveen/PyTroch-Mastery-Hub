[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-mastery-hub"
dynamic = ["version"]
description = "Comprehensive PyTorch learning resource with hands-on examples"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Satvik Praveen", email = "satvikpraveen707@gmail.com"}
]
maintainers = [
    {name = "Satvik Praveen", email = "satvikpraveen707@gmail.com"}
]
keywords = [
    "pytorch",
    "machine-learning",
    "deep-learning",
    "education",
    "tutorials",
    "neural-networks",
    "computer-vision",
    "nlp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "tqdm>=4.62.0",
    "pillow>=8.3.0",
    "requests>=2.26.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.90.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "bandit[toml]>=1.7.6",
    "types-PyYAML",
    "types-requests",
    "build>=1.0.0",
    "twine>=4.0.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "myst-parser>=0.18.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0",
    "ipywidgets>=7.6.0",
    "notebook>=6.4.0",
    "nbconvert>=6.0.0",
    "nbformat>=5.1.0",
]
advanced = [
    "transformers>=4.20.0",
    "datasets>=2.0.0",
    "optuna>=2.10.0",
    "wandb>=0.12.0",
    "lightning>=2.0.0",
    "torchsummary>=1.5.0",
    "torchmetrics>=0.9.0",
]
cv = [
    "opencv-python>=4.5.0",
    "albumentations>=1.2.0",
]
nlp = [
    "nltk>=3.6.0",
    "spacy>=3.4.0",
    "tokenizers>=0.12.0",
]
audio = [
    "librosa>=0.9.0",
    "soundfile>=0.10.0",
]
all = [
    "pytorch-mastery-hub[dev,docs,notebooks,advanced,cv,nlp,audio]",
]

[project.urls]
Homepage = "https://github.com/SatvikPraveen/PyTroch-Mastery-Hub"
Documentation = "https://github.com/SatvikPraveen/PyTroch-Mastery-Hub/tree/main/docs"
Repository = "https://github.com/SatvikPraveen/PyTroch-Mastery-Hub"
Issues = "https://github.com/SatvikPraveen/PyTroch-Mastery-Hub/issues"
Changelog = "https://github.com/SatvikPraveen/PyTroch-Mastery-Hub/blob/main/CHANGELOG.md"

[project.scripts]
pytorch-hub = "pytorch_mastery_hub.utils.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pytorch_mastery_hub.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytorch_mastery_hub = ["py.typed"]

# Ruff: linter + formatter (replaces black, isort, flake8)
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks", "docs/_build", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
    "PIE",  # flake8-pie
    "T10",  # debugger statements
    "ISC",  # implicit string concatenation
    "NPY",  # numpy-specific rules
    "PERF", # performance anti-patterns
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B006",   # mutable defaults are used deliberately for config lists
    "B008",   # torch.device(...) in defaults is idiomatic in this codebase
    "RUF001", "RUF002", "RUF003",  # unicode box-drawing in CLI output
    "RUF012", # mutable class attributes
    "SIM108", # ternaries are not always clearer
    "B905",   # zip(strict=...) is noisy for educational code
    "B007",   # unused loop variables are common in training loops
    "NPY002", # legacy np.random API is used deliberately in tutorials
    "PERF203",# try/except inside loops is fine for robustness code
    "RUF059", # unused unpacked variables document tensor shapes
    "PERF401",# explicit append loops read better in tutorials
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "RUF022", "I002"]
"tests/**/__init__.py" = ["I002"]
"scripts/**" = ["I002"]
"docs/**" = ["I002"]
"tests/**" = ["B011", "B017", "E712", "F841"]
"examples/**" = ["E402"]
"docs/conf.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pytorch_mastery_hub"]
combine-as-imports = true
# PEP 563 lazy annotations: lets `X | None` syntax work everywhere and keeps autodoc happy
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--durations=10",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["pytorch_mastery_hub"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# MyPy configuration
[tool.mypy]
# Type-check with 3.12 semantics: numpy >= 2.5 stubs use the PEP 695 `type` statement,
# which mypy rejects under python_version < 3.12. Runtime 3.10 compatibility is still
# enforced by ruff (target-version py310) and the CI test matrix.
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
exclude = ["venv", "env", "build", "dist", "notebooks"]

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "notebooks", "examples", "scripts"]
skips = ["B101", "B601"]


# Gradual typing: legacy tutorial modules are exempt until they are annotated.
# New modules must type-check cleanly (they are not listed here).
[[tool.mypy.overrides]]
module = [
    "pytorch_mastery_hub.advanced.deployment",
    "pytorch_mastery_hub.advanced.gan_utils",
    "pytorch_mastery_hub.advanced.optimization",
    "pytorch_mastery_hub.computer_vision.*",
    "pytorch_mastery_hub.fundamentals.math_utils",
    "pytorch_mastery_hub.fundamentals.tensor_ops",
    "pytorch_mastery_hub.neural_networks.layers",
    "pytorch_mastery_hub.neural_networks.models",
    "pytorch_mastery_hub.neural_networks.optimizers",
    "pytorch_mastery_hub.nlp.*",
    "pytorch_mastery_hub.utils.data_utils",
    "pytorch_mastery_hub.utils.io_utils",
    "pytorch_mastery_hub.utils.metrics",
]
ignore_errors = true
