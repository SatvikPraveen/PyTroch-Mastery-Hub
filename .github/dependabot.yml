version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # Major torch bumps are reviewed manually (API/ABI changes).
      - dependency-name: torch
        update-types: ["version-update:semver-major"]
