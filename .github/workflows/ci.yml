name: CI

on:
  push:
    branches: [main, develop]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC: catch upstream torch regressions
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # CPU wheels are ~10x smaller than the default CUDA wheels; CI never has a GPU.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    name: Lint, format, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github src tests examples scripts docs/conf.py
      - name: Ruff (format)
        run: ruff format --check src tests examples scripts docs/conf.py
      - name: mypy
        run: mypy
      - name: Bandit
        run: bandit -c pyproject.toml -r src -q

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Show environment
        run: pytorch-hub info
      - name: Run tests
        run: >
          pytest -n auto --dist loadfile
          --cov=pytorch_mastery_hub --cov-report=xml --cov-report=term-missing:skip-covered
          --junitxml=junit.xml
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml

  examples:
    name: Run example scripts
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Execute every example (synthetic data, CPU)
        env:
          MPLBACKEND: Agg
        run: |
          set -e
          for f in examples/*.py; do
            case "$f" in */__init__.py) continue ;; esac
            echo "::group::$f"
            timeout 300 python "$f"
            echo "::endgroup::"
          done

  notebooks:
    name: Execute sample notebooks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[notebooks]" psutil
      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 \
            notebooks/01_fundamentals/01_introduction_to_tensors.ipynb \
            --output-dir /tmp/executed

  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine check-wheel-contents
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify metadata and wheel contents
        run: |
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import pytorch_mastery_hub as m; print(m.__version__); from pytorch_mastery_hub.neural_networks import Trainer, TransformerLM"
          /tmp/smoke/bin/pytorch-hub info
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Sphinx build
        run: sphinx-build -b html --keep-going docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/
