# MNIST end-to-end (downloads ~12 MB on first run).
seed: 0
output_dir: outputs/mnist_mlp
data:
  name: mnist
  batch_size: 128
model:
  type: mlp
  hidden_sizes: [256, 128]
  dropout: 0.2
optimizer:
  type: adamw
  lr: 0.001
  weight_decay: 0.01
scheduler:
  type: onecycle
trainer:
  epochs: 3
  precision: auto
  clip_grad_norm: 1.0
  ema_decay: 0.999
early_stopping:
  monitor: val_loss
  patience: 2
